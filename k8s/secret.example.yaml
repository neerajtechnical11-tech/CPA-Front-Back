# DO NOT commit the real secret. Create it from your settings.env instead:
#
#   kubectl create secret generic compliance-env \
#     --from-file=settings.env=backend-svc/config/settings.env \
#     -n compliance-v2
#
# This example only documents the shape. The backend mounts it at
# /app/config/settings.env (see backend.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: compliance-env
  namespace: compliance-v2
type: Opaque
stringData:
  settings.env: |
    AZURE_OPENAI_ENDPOINT=https://<your-openai>.cognitiveservices.azure.com
    AZURE_OPENAI_KEY=<key>
    AZURE_OPENAI_CHAT_DEPLOYMENT=gpt-chat-latest
    AZURE_OPENAI_EMBED_DEPLOYMENT=text-embedding-3-large
    AZURE_SEARCH_ENDPOINT=https://<your-search>.search.windows.net
    AZURE_SEARCH_KEY=<key>
    AZURE_SEARCH_INDEX=compliance-baselines
    EMBED_DIM=3072
    AGENTIC_ROUTING=true
    # ... plus JIRA_*, SMTP_*, COSMOS_*, LANGFUSE_* as needed
